- type: reagent
  id: SanitizationFoam
  name: es-reagent-name-sanitization-foam
  desc: es-reagent-desc-sanitization-foam
  physicalDesc: reagent-physical-desc-alkaline
  flavor: alkaline
  puddleSpriteSet: Shiny
  color: "#6f377fb0"
  recognizable: true
  boilingPoint: 900
  meltingPoint: -200
  tileReactions:
    - !type:CleanTileReaction {}
    - !type:CleanDecalsReaction {}
    # gas scrubbing should be added to the foam entity when used
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Caustic: 0.2
        # commented out as we were running into an issue where, when wearing the biosuit (that resists acidic damage)
        # we would still get this message, constantly
#      - !type:PopupMessage
#        type: Local
#        visualType: Large
#        messages: [ "es-generic-reagent-effect-blistering-skin" ]
#        probability: 0.1

- type: entity
  parent: Foam
  id: FoamSterilization
  components:
    - type: ESRemoveGas
